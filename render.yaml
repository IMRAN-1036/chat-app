services:
  - type: web
    name: chat-app-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGO_URI
        scope: run
      - key: FRONTEND_URL
        value: https://chat-app-n88p.onrender.com
      - key: ALLOWED_ORIGINS
        value: https://chat-app-n88p.onrender.com
