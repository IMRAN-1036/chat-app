services:
  - type: web
    name: chat-app-backend
    runtime: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        value: https://chat-app-beryl-zeta.vercel.app
      - key: ALLOWED_ORIGINS
        value: https://chat-app-beryl-zeta.vercel.app,http://localhost:3000
